services:
  postgres:
    image: postgres:18
    container_name: spendsense-db

    environment:
      POSTGRES_DB: spendsense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    restart: unless-stopped

  app:
    build: .
    container_name: spendsense-app

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spendsense
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

    ports:
      - "8082:8082"

    restart: unless-stopped

  frontend:
    build:
      context: ../SpendSenseFrontend
      dockerfile: Dockerfile

    container_name: spendsense-frontend

    depends_on:
      - app

    ports:
      - "5173:80"

    restart: unless-stopped

volumes:
  postgres-data: