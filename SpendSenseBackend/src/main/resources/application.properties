# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8082

# ===============================
# DATABASE CONNECTION (PostgreSQL)
# ===============================
spring.datasource.url=${DBURL:jdbc:postgresql://postgres:5433/spendsense}
spring.datasource.username=${DBUSERNAME:postgres}
spring.datasource.password=${DBPASSWORD:spendsense}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# We set this to 'validate' so Hibernate doesn't try to auto-create tables, letting Flyway do the work.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY MIGRATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT / SECURITY (Custom properties likely needed by JwtTokenUtil)
# ===============================
jwt.secret=${JWT_SECRET:spend_sense_super_secret_key_change_me_in_production}
jwt.expiration=86400000